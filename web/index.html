<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kārya</title>
  <meta name="description" content="A day planner that fills itself: what is due, what is planned, what got done." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>kārya</div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab active" data-view="plan" role="tab">Plan</button>
      <button class="tab" data-view="done" role="tab">Done</button>
      <button class="tab" data-view="review" role="tab">Review</button>
    </nav>
    <div class="seg space-switch" id="spaceSwitch" role="group" aria-label="Show work, personal or both">
      <button type="button" data-space="all">All</button><button type="button" data-space="work">Work</button><button type="button" data-space="personal">Personal</button>
    </div>
    <button class="today-btn" id="todayBtn" type="button" title="Jump to today (t)">Today</button>
    <button class="theme-btn" id="themeBtn" type="button" title="Theme">◐</button>
    <div class="top-right">
      <div class="chips" id="chips"></div>
      <div class="search">
        <input id="search" type="search" placeholder="Search everything  /" autocomplete="off" spellcheck="false" aria-label="Search tasks, outcomes, notes and history" aria-controls="searchResults" title="Titles, outcomes, notes, every log entry, Linear IDs, codes and names" />
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <button class="sync" id="syncBtn" type="button" title="Pull new asks from Slack, Gmail and Linear">
        <span class="sync-dot" id="syncDot"></span><span id="syncLabel">Sync</span>
      </button>
    </div>
  </header>

  <main>
    <section class="view plan" id="view-plan">
      <div class="filter-bar" id="filterBar" hidden></div>
      <div class="board" id="board">
        <div class="column inbox" id="inboxCol" data-date="">
          <div class="col-head">
            <div><div class="col-day">Inbox</div><div class="col-sub">Not planned yet</div></div>
            <span class="col-count" id="inboxCount"></span>
          </div>
          <div class="col-body" data-date=""></div>
          <form class="quick" data-date=""><input placeholder="＋ Add to inbox" aria-label="Add a task to the inbox" /></form>
        </div>
        <div class="days" id="days"></div>
      </div>
    </section>

    <section class="view list-view" id="view-done" hidden>
      <div class="list-head">
        <h1>Done</h1>
        <div class="seg" id="doneRange">
          <button data-days="7" class="on">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button>
        </div>
      </div>
      <div id="doneList"></div>
    </section>

    <section class="view list-view" id="view-review" hidden>
      <div class="list-head">
        <h1>Review</h1>
        <div class="review-controls">
          <label>From <input type="date" id="reviewStart" /></label>
          <label>To <input type="date" id="reviewEnd" /></label>
          <button class="ghost" id="copyMd" type="button">Copy Markdown</button>
          <button class="ghost" id="downloadMd" type="button">Download .md</button>
        </div>
      </div>
      <p class="hint">Work you finished in the period, grouped by project, with the outcome noted when it was done.</p>
      <div id="reviewList"></div>
    </section>
  </main>

  <aside class="drawer" id="drawer" hidden aria-label="Task details">
    <div class="drawer-inner" id="drawerInner"></div>
  </aside>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
